<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Metadatos para PWA y visualización nativa en Android/iOS -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <meta name="mobile-web-app-capable" content="yes">
    <title>TAM WorkBalance</title>
    
    <!-- Tailwind para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React y ReactDOM para la lógica -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel para compilar React en el navegador -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
        /* Animaciones suaves */
        .animate-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[#F8F9FA] text-gray-800 antialiased pt-safe selection:bg-indigo-100">
    
    <div id="root"></div>

    <!-- CÓDIGO REACT -->
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- ICONOS SVG INLINE (Garantiza que nunca fallen) ---
        const Icon = ({ children, className="w-5 h-5", ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                {children}
            </svg>
        );
        const Activity = (p) => <Icon {...p}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></Icon>;
        const BarChart3 = (p) => <Icon {...p}><path d="M3 3v18h18"/><rect width="4" height="7" x="7" y="10" rx="1"/><rect width="4" height="12" x="15" y="5" rx="1"/></Icon>;
        const PlusCircle = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></Icon>;
        const List = (p) => <Icon {...p}><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></Icon>;
        const Clock = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></Icon>;
        const Battery = (p) => <Icon {...p}><rect width="16" height="10" x="2" y="7" rx="2" ry="2"/><line x1="22" y1="11" x2="22" y2="13"/></Icon>;
        const Brain = (p) => <Icon {...p}><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/><path d="M17.599 6.5a3 3 0 0 0 .399-1.375"/><path d="M6.002 5.125A3 3 0 0 0 6.401 6.5"/><path d="M3.477 10.896a4 4 0 0 1 .585-.396"/><path d="M19.938 10.5a4 4 0 0 1 .585.396"/><path d="M6 18a4 4 0 0 1-1.967-.516"/><path d="M19.967 17.484A4 4 0 0 1 18 18"/></Icon>;
        const Trash2 = (p) => <Icon {...p}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></Icon>;
        const Save = (p) => <Icon {...p}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></Icon>;
        const CalendarIcon = (p) => <Icon {...p}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></Icon>;
        // -----------------------------------------------------------

        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [tasks, setTasks] = useState(() => {
                try {
                    const savedTasks = localStorage.getItem('tam_workbalance_data');
                    if (savedTasks) return JSON.parse(savedTasks);
                } catch (e) {
                    console.error("Error cargando datos:", e);
                }
                return [];
            });
            const [taskToDelete, setTaskToDelete] = useState(null);

            useEffect(() => {
                try {
                    localStorage.setItem('tam_workbalance_data', JSON.stringify(tasks));
                } catch (e) {
                    console.error("Error guardando datos:", e);
                }
            }, [tasks]);

            const TaskForm = ({ onSave }) => {
                const [formData, setFormData] = useState({
                    title: '', category: 'atencion_directa', durationHours: 0, durationMinutes: 30,
                    difficulty: 3, energyDrain: 3, date: new Date().toISOString().split('T')[0],
                    isBillable: true, isExtraRole: false, qualificationLevel: 'media'
                });

                const handleChange = (e) => {
                    const { name, value, type, checked } = e.target;
                    setFormData(prev => ({
                        ...prev, [name]: type === 'checkbox' ? checked : (type === 'number' || type === 'range') ? Number(value) : value
                    }));
                };

                const handleSubmit = (e) => {
                    e.preventDefault();
                    const newTask = {
                        ...formData, timestamp: Date.now(),
                        totalMinutes: (formData.durationHours * 60) + formData.durationMinutes,
                        id: Date.now().toString()
                    };
                    onSave(newTask);
                    setFormData(prev => ({ ...prev, title: '', durationHours: 0, durationMinutes: 30, difficulty: 3, energyDrain: 3, isExtraRole: false, qualificationLevel: 'media' }));
                };

                return (
                    <div className="bg-white rounded-xl shadow-md p-4 sm:p-6 max-w-2xl mx-auto border border-gray-100 animate-in">
                        <h2 className="text-xl sm:text-2xl font-bold mb-6 text-gray-800 flex items-center">
                            <PlusCircle className="mr-2 text-indigo-600 w-6 h-6" /> Registrar Tarea
                        </h2>
                        <form onSubmit={handleSubmit} className="space-y-6">
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div className="md:col-span-2">
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
                                    <input type="text" name="title" required value={formData.title} onChange={handleChange} placeholder="Ej: Taller, Medicación, Incidencia..." className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 transition-colors" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Fecha</label>
                                    <input type="date" name="date" required value={formData.date} onChange={handleChange} className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" />
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Categoría</label>
                                    <select name="category" value={formData.category} onChange={handleChange} className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 bg-white">
                                        <option value="atencion_directa">Atención Directa (Pacientes/Talleres)</option>
                                        <option value="rutina_cuidados">Rutina y Cuidados (Comidas, Higiene)</option>
                                        <option value="gestion">Gestión / Coord. (Tickets, Padres, Org.)</option>
                                        <option value="guardias">Guardias / Pernoctas (Disponibilidad)</option>
                                        <option value="apoyo_emocional">Apoyo Psicológico/Emocional</option>
                                    </select>
                                </div>
                                <div className="flex items-center space-x-3 bg-gray-50 p-3 rounded-lg border border-gray-200 mt-2 md:mt-0">
                                    <input type="checkbox" id="isBillable" name="isBillable" checked={formData.isBillable} onChange={handleChange} className="h-5 w-5 text-indigo-600" />
                                    <label htmlFor="isBillable" className="text-sm font-medium text-gray-700 select-none">Dentro de horario oficial</label>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-purple-50 p-4 rounded-lg border border-purple-100">
                                <div>
                                    <label className="block text-sm font-bold text-purple-800 mb-2">Cualificación Aplicada</label>
                                    <select name="qualificationLevel" value={formData.qualificationLevel} onChange={handleChange} className="w-full p-2 border border-purple-200 rounded-lg focus:ring-2 focus:ring-purple-500 bg-white">
                                        <option value="basica">Básica (Auxiliar / Apoyo)</option>
                                        <option value="media">Media (Técnico / Educador)</option>
                                        <option value="alta">Alta (Especialista / Terapeuta / Coord.)</option>
                                    </select>
                                </div>
                                <div className="flex items-center space-x-3 mt-4 md:mt-6">
                                    <input type="checkbox" id="isExtraRole" name="isExtraRole" checked={formData.isExtraRole} onChange={handleChange} className="h-5 w-5 text-purple-600" />
                                    <label htmlFor="isExtraRole" className="text-sm font-bold text-purple-800 select-none">⚠️ Excede mis funciones / Puesto</label>
                                </div>
                            </div>

                            <div className="bg-blue-50 p-4 rounded-lg border border-blue-100">
                                <label className="block text-sm font-bold text-blue-800 mb-3 flex items-center"><Clock className="w-4 h-4 mr-1" /> Tiempo Empleado</label>
                                <div className="flex space-x-4">
                                    <div className="flex-1">
                                        <label className="block text-xs text-blue-600 mb-1">Horas</label>
                                        <input type="number" name="durationHours" min="0" max="24" value={formData.durationHours} onChange={handleChange} className="w-full p-3 border border-blue-200 rounded-lg bg-white" />
                                    </div>
                                    <div className="flex-1">
                                        <label className="block text-xs text-blue-600 mb-1">Minutos</label>
                                        <select name="durationMinutes" value={formData.durationMinutes} onChange={handleChange} className="w-full p-3 border border-blue-200 rounded-lg bg-white">
                                            <option value="0">00</option><option value="15">15</option><option value="30">30</option><option value="45">45</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-6 bg-orange-50 p-4 rounded-lg border border-orange-100">
                                <div>
                                    <label className="block text-sm font-bold text-orange-800 mb-2 flex items-center"><Brain className="w-4 h-4 mr-1" /> Dificultad Mental</label>
                                    <input type="range" name="difficulty" min="1" max="5" value={formData.difficulty} onChange={handleChange} className="w-full accent-orange-500" />
                                    <div className="text-center text-sm font-medium text-orange-700 mt-1">Nivel {formData.difficulty}/5</div>
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-orange-800 mb-2 flex items-center"><Battery className="w-4 h-4 mr-1" /> Desgaste Energético</label>
                                    <input type="range" name="energyDrain" min="1" max="5" value={formData.energyDrain} onChange={handleChange} className="w-full accent-red-500" />
                                    <div className="text-center text-sm font-medium text-orange-700 mt-1">Nivel {formData.energyDrain}/5</div>
                                </div>
                            </div>

                            <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-4 rounded-xl flex items-center justify-center transition-colors shadow-lg active:scale-95">
                                <Save className="mr-2 w-5 h-5" /> Guardar Tarea
                            </button>
                        </form>
                    </div>
                );
            };

            const Dashboard = ({ tasks }) => {
                const stats = useMemo(() => {
                    const t = { minutesTotal: 0, minutesExtraRole: 0, minutesHighQual: 0, avgEnergy: 0 };
                    if (tasks.length === 0) return t;
                    let sumEnergy = 0;
                    tasks.forEach(task => {
                        t.minutesTotal += task.totalMinutes;
                        if (task.isExtraRole) t.minutesExtraRole += task.totalMinutes;
                        if (task.qualificationLevel === 'alta') t.minutesHighQual += task.totalMinutes;
                        sumEnergy += task.energyDrain;
                    });
                    t.avgEnergy = (sumEnergy / tasks.length).toFixed(1);
                    return t;
                }, [tasks]);

                const formatHours = (mins) => `${Math.floor(mins / 60)}h ${mins % 60}m`;
                const extraRolePct = stats.minutesTotal > 0 ? ((stats.minutesExtraRole / stats.minutesTotal) * 100).toFixed(0) : 0;

                if (tasks.length === 0) {
                    return (
                        <div className="text-center p-12 bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col items-center animate-in">
                            <BarChart3 className="h-16 w-16 text-gray-200 mb-4" />
                            <h3 className="text-lg font-bold text-gray-800">Panel sin datos</h3>
                            <p className="text-gray-500 mt-2 text-sm max-w-sm">Registra tu primer turno para que el sistema genere las métricas de evaluación de competencias.</p>
                        </div>
                    );
                }

                return (
                    <div className="space-y-4 sm:space-y-6 animate-in">
                        <div className="bg-gradient-to-br from-slate-900 to-indigo-900 rounded-2xl p-6 sm:p-8 text-white shadow-xl">
                            <h2 className="text-xl sm:text-2xl font-bold mb-2 flex items-center"><Activity className="w-6 h-6 mr-2 text-indigo-400" /> Auditoría de Competencias</h2>
                            <p className="text-indigo-100 opacity-90 text-sm sm:text-base max-w-2xl">Métricas recopiladas para evidenciar el desajuste entre la responsabilidad asumida (guardias, coordinación), la alta cualificación aportada y el rol contractual.</p>
                        </div>
                        
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                            <div className="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm relative overflow-hidden">
                                <h3 className="text-xs font-bold text-gray-500 uppercase mb-2">Total Registrado</h3>
                                <p className="text-3xl font-extrabold text-gray-900">{formatHours(stats.minutesTotal)}</p>
                            </div>
                            <div className="bg-red-50 rounded-2xl p-6 border border-red-100 shadow-sm relative overflow-hidden">
                                <h3 className="text-xs font-bold text-red-800 uppercase mb-2">⚠️ Excede Puesto</h3>
                                <p className="text-3xl font-extrabold text-red-700">{formatHours(stats.minutesExtraRole)}</p>
                                <span className="mt-2 inline-block bg-red-100 text-red-800 text-xs font-bold px-2 py-1 rounded">{extraRolePct}% del tiempo</span>
                            </div>
                            <div className="bg-purple-50 rounded-2xl p-6 border border-purple-100 shadow-sm relative overflow-hidden">
                                <h3 className="text-xs font-bold text-purple-800 uppercase mb-2">🎓 Alta Cualificación</h3>
                                <p className="text-3xl font-extrabold text-purple-700">{formatHours(stats.minutesHighQual)}</p>
                                <p className="text-xs text-purple-600 mt-2 font-medium">Especialista / Coordinación</p>
                            </div>
                        </div>

                        <div className="bg-white rounded-2xl shadow-sm p-6 border border-gray-100 flex flex-col sm:flex-row justify-between sm:items-center gap-4">
                            <div>
                                <h3 className="text-sm font-bold text-gray-700 mb-1 flex items-center"><Battery className="w-4 h-4 mr-1 text-red-500" /> Índice de Desgaste</h3>
                                <p className="text-sm text-gray-500">Media del desgaste físico/mental.</p>
                            </div>
                            <div className="flex items-center gap-4">
                                <p className="text-3xl font-extrabold text-gray-900 w-16 text-right">{stats.avgEnergy}<span className="text-base text-gray-400">/5</span></p>
                                <div className="w-32 h-3 bg-gray-100 rounded-full overflow-hidden">
                                    <div className="h-full bg-red-500 rounded-full" style={{ width: `${(stats.avgEnergy / 5) * 100}%` }}></div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-indigo-50 border border-indigo-100 rounded-2xl p-6 sm:p-8 shadow-sm">
                            <h3 className="text-lg font-bold text-indigo-900 mb-4 flex items-center"><BarChart3 className="w-5 h-5 mr-2" /> Argumentos para Revisión</h3>
                            <ul className="space-y-3 text-sm sm:text-base text-indigo-900">
                                <li className="flex items-start bg-white/60 p-4 rounded-xl"><span className="text-red-500 mr-2 font-bold">➜</span><span><strong>Extralimitación:</strong> El <strong>{extraRolePct}%</strong> del tiempo se destina a responsabilidades que exceden la categoría base.</span></li>
                                <li className="flex items-start bg-white/60 p-4 rounded-xl"><span className="text-purple-600 mr-2 font-bold">➜</span><span><strong>Valor no remunerado:</strong> Se aportan <strong>{formatHours(stats.minutesHighQual)}</strong> aplicando competencias técnicas superiores (talleres, terapias).</span></li>
                                <li className="flex items-start bg-white/60 p-4 rounded-xl"><span className="text-orange-600 mr-2 font-bold">➜</span><span><strong>Penosidad:</strong> El desgaste medio es de <strong>{stats.avgEnergy}/5</strong>, lo que requiere pluses de nocturnidad o disponibilidad.</span></li>
                            </ul>
                        </div>
                    </div>
                );
            };

            const TaskList = ({ tasks, onDelete }) => {
                if (tasks.length === 0) {
                    return (
                        <div className="text-center p-12 bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col items-center animate-in">
                            <List className="h-16 w-16 text-gray-200 mb-4" />
                            <h3 className="text-lg font-bold text-gray-800">Historial vacío</h3>
                            <p className="text-gray-500 mt-2 text-sm max-w-sm">No has registrado ninguna tarea todavía.</p>
                        </div>
                    );
                }

                const groupedTasks = tasks.reduce((acc, task) => {
                    if (!acc[task.date]) acc[task.date] = [];
                    acc[task.date].push(task);
                    return acc;
                }, {});

                const sortedDates = Object.keys(groupedTasks).sort((a, b) => new Date(b) - new Date(a));
                
                const getCatInfo = (c) => {
                    const d = { atencion_directa: 'Atención Directa', gestion: 'Gestión / Coord.', rutina_cuidados: 'Rutinas / Cuidados', guardias: 'Guardias / Pernoctas', apoyo_emocional: 'Apoyo Emocional' };
                    return d[c] || c;
                };
                const getCatColor = (c) => {
                    const d = { atencion_directa: 'bg-red-50 text-red-700 border-red-200', gestion: 'bg-indigo-50 text-indigo-700 border-indigo-200', rutina_cuidados: 'bg-blue-50 text-blue-700 border-blue-200', guardias: 'bg-emerald-50 text-emerald-700 border-emerald-200', apoyo_emocional: 'bg-amber-50 text-amber-700 border-amber-200' };
                    return d[c] || 'bg-gray-50 text-gray-700 border-gray-200';
                };

                return (
                    <div className="space-y-6 animate-in">
                        {sortedDates.map(date => {
                            const [y, m, d] = date.split('-');
                            const formatted = new Date(y, m-1, d).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'short' });
                            return (
                                <div key={date} className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                                    <div className="bg-gray-50 px-4 py-3 border-b border-gray-100 flex items-center">
                                        <CalendarIcon className="w-5 h-5 text-indigo-500 mr-2" />
                                        <h3 className="font-bold text-gray-700 capitalize">{formatted}</h3>
                                    </div>
                                    <ul className="divide-y divide-gray-50">
                                        {groupedTasks[date].map(task => (
                                            <li key={task.id} className="p-4 hover:bg-indigo-50/50 transition-colors">
                                                <div className="flex justify-between items-start gap-2">
                                                    <div className="flex-1">
                                                        <div className="flex flex-wrap gap-2 mb-2">
                                                            <span className={`text-[11px] px-2.5 py-1 rounded-md border font-semibold ${getCatColor(task.category)}`}>{getCatInfo(task.category)}</span>
                                                            {!task.isBillable && <span className="text-[11px] px-2.5 py-1 rounded-md bg-gray-100 text-gray-600 border border-gray-200 font-semibold">Fuera Horario</span>}
                                                            {task.isExtraRole && <span className="text-[11px] px-2.5 py-1 rounded-md bg-red-100 text-red-700 border border-red-200 font-bold shadow-sm">⚠️ Excede Puesto</span>}
                                                            {task.qualificationLevel === 'alta' && <span className="text-[11px] px-2.5 py-1 rounded-md bg-purple-100 text-purple-700 border border-purple-200 font-bold shadow-sm">🎓 Alta Cualif.</span>}
                                                        </div>
                                                        <h4 className="font-bold text-gray-900 text-base leading-tight">{task.title}</h4>
                                                        <div className="mt-3 flex flex-wrap gap-2 sm:gap-4 text-xs font-medium text-gray-600">
                                                            <span className="flex items-center bg-gray-100 px-2 py-1 rounded-md"><Clock className="w-3.5 h-3.5 mr-1" /> {task.durationHours > 0 ? `${task.durationHours}h ` : ''}{task.durationMinutes > 0 ? `${task.durationMinutes}m` : ''}</span>
                                                            <span className="flex items-center text-orange-700 bg-orange-50/50 px-2 py-1 rounded-md border border-orange-100"><Brain className="w-3.5 h-3.5 mr-1" /> Dif: {task.difficulty}/5</span>
                                                            <span className="flex items-center text-red-700 bg-red-50/50 px-2 py-1 rounded-md border border-red-100"><Battery className="w-3.5 h-3.5 mr-1" /> Desg: {task.energyDrain}/5</span>
                                                        </div>
                                                    </div>
                                                    <button onClick={() => onDelete(task.id)} className="text-gray-400 hover:text-red-600 p-2 rounded-xl hover:bg-red-50 transition-colors flex-shrink-0" title="Eliminar"><Trash2 className="w-5 h-5" /></button>
                                                </div>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            );
                        })}
                    </div>
                );
            };

            return (
                <div className="min-h-screen flex flex-col pb-20 sm:pb-0">
                    
                    {/* Modal Confirmación */}
                    {taskToDelete && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/60 backdrop-blur-sm transition-opacity">
                            <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl animate-in">
                                <h3 className="text-xl font-bold text-gray-900 mb-2">Eliminar Tarea</h3>
                                <p className="text-gray-500 mb-6 text-sm">¿Estás seguro? Esta acción borrará el dato de tu móvil permanentemente.</p>
                                <div className="flex justify-end gap-3">
                                    <button onClick={() => setTaskToDelete(null)} className="px-4 py-2 text-gray-700 font-semibold hover:bg-gray-100 rounded-xl transition-colors">Cancelar</button>
                                    <button onClick={() => { setTasks(prev => prev.filter(t => t.id !== taskToDelete)); setTaskToDelete(null); }} className="px-4 py-2 bg-red-600 text-white font-semibold hover:bg-red-700 rounded-xl transition-colors shadow-sm flex items-center"><Trash2 className="w-4 h-4 mr-2" /> Eliminar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Header */}
                    <header className="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
                        <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between items-center h-16">
                                <div className="flex items-center gap-3">
                                    <div className="bg-indigo-600 p-2 rounded-xl text-white shadow-inner"><Activity className="w-5 h-5" /></div>
                                    <div className="flex flex-col justify-center">
                                        <h1 className="text-lg font-extrabold text-gray-900 leading-tight">TAM WorkBalance</h1>
                                        <span className="text-[10px] font-bold text-indigo-500 tracking-wider uppercase">Tracker Profesional</span>
                                    </div>
                                </div>
                                <nav className="hidden sm:flex space-x-1 bg-gray-100 p-1 rounded-xl">
                                    <button onClick={() => setActiveTab('dashboard')} className={`flex items-center px-4 py-2 rounded-lg text-sm font-bold transition-all ${activeTab === 'dashboard' ? 'bg-white text-indigo-700 shadow-sm' : 'text-gray-500 hover:text-gray-900'}`}><BarChart3 className="w-4 h-4 mr-2" /> Resumen</button>
                                    <button onClick={() => setActiveTab('form')} className={`flex items-center px-4 py-2 rounded-lg text-sm font-bold transition-all ${activeTab === 'form' ? 'bg-white text-indigo-700 shadow-sm' : 'text-gray-500 hover:text-gray-900'}`}><PlusCircle className="w-4 h-4 mr-2" /> Registrar</button>
                                    <button onClick={() => setActiveTab('list')} className={`flex items-center px-4 py-2 rounded-lg text-sm font-bold transition-all ${activeTab === 'list' ? 'bg-white text-indigo-700 shadow-sm' : 'text-gray-500 hover:text-gray-900'}`}><List className="w-4 h-4 mr-2" /> Historial</button>
                                </nav>
                            </div>
                        </div>
                    </header>

                    {/* Contenido */}
                    <main className="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
                        {activeTab === 'dashboard' && <Dashboard tasks={tasks} />}
                        {activeTab === 'form' && <TaskForm onSave={(t) => { setTasks(prev => [t, ...prev].sort((a,b) => new Date(b.date) - new Date(a.date))); setActiveTab('list'); }} />}
                        {activeTab === 'list' && <TaskList tasks={tasks} onDelete={setTaskToDelete} />}
                    </main>

                    {/* Navbar Móvil */}
                    <div className="sm:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-40 pb-safe shadow-[0_-5px_15px_-3px_rgba(0,0,0,0.05)]">
                        <div className="flex justify-around items-center h-16 px-2">
                            <button onClick={() => setActiveTab('dashboard')} className="flex flex-col items-center justify-center flex-1 h-full pt-1">
                                <div className={`p-1.5 rounded-xl transition-all ${activeTab === 'dashboard' ? 'bg-indigo-50 text-indigo-600' : 'text-gray-400'}`}><BarChart3 className="w-6 h-6" /></div>
                                <span className={`text-[10px] font-bold mt-0.5 ${activeTab === 'dashboard' ? 'text-indigo-600' : 'text-gray-400'}`}>Resumen</span>
                            </button>
                            <button onClick={() => setActiveTab('form')} className="flex flex-col items-center justify-center flex-1 h-full -mt-6">
                                <div className={`p-3.5 rounded-2xl shadow-lg transition-transform active:scale-90 ${activeTab === 'form' ? 'bg-indigo-700 text-white' : 'bg-indigo-600 text-white'}`}><PlusCircle className="w-6 h-6" /></div>
                            </button>
                            <button onClick={() => setActiveTab('list')} className="flex flex-col items-center justify-center flex-1 h-full pt-1">
                                <div className={`p-1.5 rounded-xl transition-all ${activeTab === 'list' ? 'bg-indigo-50 text-indigo-600' : 'text-gray-400'}`}><List className="w-6 h-6" /></div>
                                <span className={`text-[10px] font-bold mt-0.5 ${activeTab === 'list' ? 'text-indigo-600' : 'text-gray-400'}`}>Historial</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
